<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>選舉人生：福爾摩沙</title>
<!-- 這是單檔版：所有程式與資料都在這個檔案裡，可以直接雙擊開啟。 -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
ul,ol{list-style:none}
img,svg{display:block;max-width:100%}
table{border-collapse:collapse;width:100%}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

:root{
  --bg:#0e1116; --bg-2:#151a22; --bg-3:#1c232d; --bg-4:#242d3a;
  --line:#2a3441; --line-2:#3a4757;
  --fg:#e6ebf2; --fg-2:#a8b4c4; --fg-3:#6f7d8f;
  --accent:#4ea1ff; --accent-2:#2b6fd4;
  --good:#39c07a; --ok:#7bc96f; --mid:#d9b23c; --warn:#e2893c; --bad:#e2564a;
  --gold:#d9b23c;
  --pda:#1B9C5A; --crp:#1F4E9C; --tpl:#18B4B4; --ngf:#E8B62C;
  --twr:#E0457B; --gsp:#4C7A34; --cua:#B01F2E; --ind:#8a8f98;
  --r-s:6px; --r:10px; --r-l:16px;
  --fs:15px; --fs-s:13px; --fs-xs:11.5px; --fs-l:17px; --fs-xl:21px;
  --sp:12px;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-fs="s"]{--fs:13.5px;--fs-s:12px;--fs-xs:10.5px;--fs-l:15px;--fs-xl:19px}
:root[data-fs="l"]{--fs:17px;--fs-s:15px;--fs-xs:13px;--fs-l:19.5px;--fs-xl:24px}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs)}
.tone-good{color:var(--good)} .tone-ok{color:var(--ok)} .tone-mid{color:var(--mid)}
.tone-warn{color:var(--warn)} .tone-bad{color:var(--bad)}
.up2,.up1{color:var(--good)} .down1,.down2{color:var(--bad)} .flux{color:var(--fg-3)}
.p-PDA{color:var(--pda)} .p-CRP{color:var(--crp)} .p-TPL{color:var(--tpl)}
.p-NGF{color:var(--ngf)} .p-TWR{color:var(--twr)} .p-GSP{color:var(--gsp)}
.p-CUA{color:var(--cua)} .p-IND{color:var(--ind)}
.bg-PDA{background:var(--pda)} .bg-CRP{background:var(--crp)} .bg-TPL{background:var(--tpl)}
.bg-NGF{background:var(--ngf)} .bg-TWR{background:var(--twr)} .bg-GSP{background:var(--gsp)}
.bg-CUA{background:var(--cua)} .bg-IND{background:var(--ind)}

#app{display:flex;flex-direction:column;min-height:100dvh;max-width:560px;margin:0 auto;
  background:var(--bg);position:relative}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg-2),var(--bg-2) 88%,transparent);
  border-bottom:1px solid var(--line);padding:10px 14px 8px}
.tb-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.tb-date{font-size:var(--fs-l);font-weight:700;letter-spacing:.02em}
.tb-role{font-size:var(--fs-xs);color:var(--fg-2)}
.tb-meta{display:flex;gap:14px;align-items:center;margin-top:5px;font-size:var(--fs-xs);color:var(--fg-2);flex-wrap:wrap}
.ap-dots{display:inline-flex;gap:3px;vertical-align:-1px}
.ap-dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:block}
.ap-dots i.on{background:var(--accent)}
.view{flex:1;padding:14px 14px calc(76px + var(--safe-b));overflow-x:hidden}
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:40;
  display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-2);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.navbar button{padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:var(--fs-xs);color:var(--fg-3);border-top:2px solid transparent}
.navbar button.on{color:var(--accent);border-top-color:var(--accent);background:var(--bg-3)}
.navbar .ico{font-size:16px;line-height:1}
.navbar .dot{position:absolute;transform:translate(14px,-4px);width:7px;height:7px;border-radius:50%;background:var(--bad)}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.boot-inner{text-align:center;padding:24px;max-width:340px}
.boot-title{font-size:30px;font-weight:800;letter-spacing:.08em;line-height:1.3}
.boot-title span{display:block;font-size:15px;font-weight:500;color:var(--fg-3);letter-spacing:.32em;margin-top:6px}
.boot-sub{color:var(--fg-3);font-size:var(--fs-s);margin:16px 0 22px}
.boot-bar{height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.boot-msg{margin-top:12px;font-size:var(--fs-xs);color:var(--fg-3);font-family:var(--mono)}
@media (min-width:600px){.view{padding-bottom:calc(80px + var(--safe-b))}}

.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:10px}
.card.tight{padding:10px 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-t{font-size:var(--fs-s);font-weight:700;color:var(--fg-2);letter-spacing:.05em}
.sec-t{font-size:var(--fs-xs);color:var(--fg-3);letter-spacing:.12em;margin:16px 0 7px;font-weight:700}
.sec-t:first-child{margin-top:0}
.muted{color:var(--fg-3)} .dim{color:var(--fg-2)}
.small{font-size:var(--fs-s)} .xs{font-size:var(--fs-xs)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.row+.row{border-top:1px solid var(--line)}
.row-k{color:var(--fg-2);font-size:var(--fs-s);flex-shrink:0}
.row-v{font-weight:600;text-align:right}
.word{font-weight:700;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg-3);border-radius:var(--r-s);padding:9px 10px}
.tile-k{font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:3px}
.tile-v{font-size:var(--fs-l);font-weight:700;letter-spacing:.03em}
.tile-v.sm{font-size:var(--fs)}
.bar{height:5px;background:var(--bg-4);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.bar.g i{background:var(--good)} .bar.m i{background:var(--mid)} .bar.b i{background:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-s);
  font-size:var(--fs-s);font-weight:600;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent-2);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg-4);
  font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em}
.chip.on{background:var(--accent-2);color:#fff}
.chip.warn{background:#3a2a1a;color:var(--warn)}
.chip.bad{background:#3a1e1c;color:var(--bad)}
.news{border-left:2px solid var(--line-2);padding:8px 0 8px 11px;margin-bottom:2px}
.news+.news{border-top:1px solid var(--line)}
.news-t{font-size:var(--fs-s);line-height:1.6}
.news-m{font-size:var(--fs-xs);color:var(--fg-3);margin-top:3px;display:flex;gap:8px}
.news.k-scandal{border-left-color:var(--bad)} .news.k-law{border-left-color:var(--accent)}
.news.k-energy{border-left-color:var(--warn)} .news.k-corp{border-left-color:var(--gold)}
.news.k-party{border-left-color:var(--ngf)} .news.k-personal{border-left-color:var(--good)}
.pending{background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r);
  padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
.pending .pi{font-size:17px;line-height:1.3;flex-shrink:0}
.pending .ph{font-weight:700;font-size:var(--fs-s);line-height:1.5}
.pending .pb{font-size:var(--fs-xs);color:var(--fg-2);margin-top:3px}
.modal-bd{position:fixed;inset:0;background:rgba(4,7,11,.78);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-l) var(--r-l) 0 0;
  width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;padding:16px 15px calc(20px + var(--safe-b));
  animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-h{font-size:var(--fs-l);font-weight:700;line-height:1.5;margin-bottom:8px}
.modal-b{font-size:var(--fs-s);color:var(--fg-2);line-height:1.75;margin-bottom:14px}
.opt{width:100%;text-align:left;background:var(--bg-3);border:1px solid var(--line);
  border-radius:var(--r-s);padding:11px 12px;margin-bottom:8px;transition:.15s}
.opt:active{background:var(--bg-4)}
.opt-t{font-weight:600;font-size:var(--fs-s)}
.opt-h{font-size:var(--fs-xs);color:var(--fg-3);margin-top:4px;line-height:1.6}
.opt-e{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.eff{font-size:var(--fs-xs);padding:1px 6px;border-radius:4px;background:var(--bg-4);font-weight:600}
.eff.up{color:var(--good)} .eff.down{color:var(--bad)}
.opt.locked{opacity:.4}
.lawrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.lawrow:last-child{border-bottom:none}
.lawrow .ln{flex:1;min-width:0}
.lawrow .lt{font-size:var(--fs-s);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lawrow .lc{font-size:var(--fs-xs);color:var(--fg-3)}
.tiers{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tier{flex:1;min-width:64px;padding:7px 6px;border-radius:var(--r-s);background:var(--bg-3);
  border:1px solid var(--line);font-size:var(--fs-xs);text-align:center;line-height:1.4}
.tier.cur{border-color:var(--accent);background:var(--accent-2);color:#fff;font-weight:700}
.tier.pick{border-color:var(--gold)}
.axis{margin-bottom:11px}
.axis-h{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:4px}
.axis-t{display:flex;justify-content:center;font-size:var(--fs-s);font-weight:700;margin-top:4px;letter-spacing:.05em}
.axis-track{height:6px;background:var(--bg-4);border-radius:3px;position:relative}
.axis-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.axis-track i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);
  transform:translateX(-6px);transition:left .3s}
.mapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mapcell{aspect-ratio:1;border-radius:var(--r-s);background:var(--bg-3);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:var(--fs-xs);line-height:1.25;padding:2px;text-align:center}
.mapcell b{font-size:var(--fs-xs);font-weight:700}
.mapcell.void{background:none;border:none}
.seatchart{display:flex;height:22px;border-radius:4px;overflow:hidden;margin:8px 0 6px}
.seatchart i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:var(--fs-xs)}
.legend span{display:flex;align-items:center;gap:4px}
.legend em{width:9px;height:9px;border-radius:2px;font-style:normal}
.staff{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.staff:last-child{border-bottom:none}
.staff .av{width:34px;height:34px;border-radius:50%;background:var(--bg-4);display:grid;place-items:center;
  font-size:var(--fs-s);font-weight:700;flex-shrink:0}
.staff .si{flex:1;min-width:0}
.donation{border:1px solid var(--gold);border-radius:var(--r);padding:11px 12px;margin-bottom:9px;background:var(--bg-3)}
.donation .dam{font-size:var(--fs-xl);font-weight:800;letter-spacing:.02em}
.warnline{color:var(--warn);font-size:var(--fs-xs);margin-top:6px;line-height:1.6}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--bg-4);
  font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;margin:0 5px 5px 0;border:1px solid var(--line-2)}
.setup-step{margin-bottom:18px}
.setup-step h3{font-size:var(--fs-s);color:var(--fg-2);margin-bottom:8px;letter-spacing:.06em}
.pick{display:grid;gap:7px}
.pick button{text-align:left;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.pick button.on{border-color:var(--accent);background:var(--bg-4)}
.pick .pt{font-weight:700;font-size:var(--fs-s)}
.pick .pd{font-size:var(--fs-xs);color:var(--fg-3);margin-top:3px;line-height:1.6}
.field{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.field label{font-size:var(--fs-s);color:var(--fg-2);width:74px;flex-shrink:0}
.field input,.field select{flex:1;background:var(--bg-3);border:1px solid var(--line);
  border-radius:var(--r-s);padding:8px 10px;font-size:var(--fs-s)}
.attrline{display:flex;align-items:center;gap:8px;padding:5px 0}
.attrline .an{width:34px;font-size:var(--fs-s);color:var(--fg-2)}
.attrline .aw{width:76px;font-weight:700;font-size:var(--fs-s);letter-spacing:.05em}
.attrline .ab{flex:1}
.pips{display:flex;gap:3px}
.pips i{width:100%;height:6px;border-radius:2px;background:var(--bg-4)}
.pips i.on{background:var(--accent)}
.result-big{text-align:center;padding:14px 0}
.result-big .rb{font-size:26px;font-weight:800;letter-spacing:.06em}
.votebar{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.votebar:last-child{border-bottom:none}
.votebar .vn{width:82px;font-size:var(--fs-s);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votebar .vb{flex:1;height:16px;background:var(--bg-4);border-radius:3px;overflow:hidden}
.votebar .vb i{display:block;height:100%}
.votebar .vp{width:52px;text-align:right;font-family:var(--mono);font-size:var(--fs-s)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);
  background:var(--bg-4);border:1px solid var(--line-2);border-radius:99px;padding:9px 17px;
  font-size:var(--fs-s);z-index:300;max-width:88vw;text-align:center;animation:up .2s}
svg.chart{width:100%;height:auto;display:block}
.spark{display:block;width:100%;height:38px}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.actbtn{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-s);
  padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.actbtn:active{background:var(--bg-4)}
.actbtn .an{font-size:var(--fs-s);font-weight:600;letter-spacing:.02em}
.actbtn .aa{font-size:var(--fs-xs);color:var(--fg-3)}
.actbtn.locked{opacity:.35}
.mapcell .cw{font-size:9px;color:var(--fg-3);line-height:1.15;letter-spacing:-.02em}
.mapcell{aspect-ratio:1.18}
.lockbox{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.lockbox summary{font-size:var(--fs-xs);color:var(--fg-3);cursor:pointer;list-style:none}
.lockbox summary::-webkit-details-marker{display:none}
.lockbox summary::before{content:"▸ ";}
.lockbox[open] summary::before{content:"▾ ";}
.lockrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:var(--fs-xs)}
.lockrow b{color:var(--fg-2);flex-shrink:0}
.lockrow span{color:var(--fg-3);text-align:right}
.justice{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.justice:last-child{border-bottom:none}
.justice .jn{flex:1;min-width:0;font-size:var(--fs-s)}
.justice .jl{width:66px;height:6px;background:var(--bg-4);border-radius:3px;position:relative;flex-shrink:0}
.justice .jl i{position:absolute;top:-2px;width:10px;height:10px;border-radius:50%;transform:translateX(-5px)}

.tabrow{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabrow::-webkit-scrollbar{display:none}
.tabrow .btn{flex:0 0 auto;padding:7px 13px;font-size:var(--fs-s)}

</style>
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-inner">
    <h1 class="boot-title">選舉人生<span>福爾摩沙</span></h1>
    <p class="boot-sub">從二〇二六年的一個沒沒無聞的人開始</p>
    <div class="boot-bar"><i id="bootBar"></i></div>
    <p id="bootMsg" class="boot-msg">正在載入這座島嶼……</p>
  </div>
</div>
<div id="app" hidden>
  <header id="topbar" class="topbar"></header>
  <main id="view" class="view"></main>
  <nav id="navbar" class="navbar"></nav>

immigrationInflow":"移入人口流量（比率）","carbonIntensity":"碳排強度（比率）","energyPrice":"能源價格（比率）","tourismRevenue":"觀光與農產出口收入（比率）","militancyLocalist":"本土認同 POP 激進度（級）","militancyUnionist":"統派 POP 激進度（級）","intlVisibility":"國際能見度（級）","lawPassBonus":"法案通過門檻調整（比率，正值為較易通過）"},"axes":[{"id":"centralization","negName":"地方自治","posName":"中央集權","start":1,"desc":"決定統籌分配稅款、人事權與重大建設審查權究竟握在中央還是二十二個縣市手上。台灣的憲政設計本就中央偏強，但地方首長掌握選票與媒體版面，這條軸實際上是在問：防疫、能源、都市計畫這類跨域問題，該由誰說了算。","brackets":[{"range":[-5,-4],"label":"地方自治・主流共識","modifiers":{"localAutonomy":2,"adminEfficiency":-1.2,"gdpGrowth":-0.002,"socialTrust":0.5,"lawPassBonus":-0.1},"desc":"縣市各行其是，中央法令到了地方還要再協商一輪，跨域政策幾乎無法推動，但地方治理貼近民意。"},{"range":[-3,-2],"label":"地方自治・略有傾向","modifiers":{"localAutonomy":1,"adminEfficiency":-0.5,"socialTrust":0.2},"desc":"地方保有實質否決權，中央推動全國性政策時必須付出更多預算與協商成本才能取得同意。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"中央與地方權責大致平衡，爭議個案循既有府際協商機制處理，沒有結構性的偏移。"},{"range":[2,3],"label":"中央集權・略有傾向","modifiers":{"adminEfficiency":0.6,"localAutonomy":-1,"lawPassBonus":0.05},"desc":"中央部會的指導力上升，全國一致的政策較易落地，地方首長的抗命成本明顯提高。"},{"range":[4,5],"label":"中央集權・主流共識","modifiers":{"adminEfficiency":1.4,"localAutonomy":-2,"socialTrust":-0.8,"lawPassBonus":0.15,"publicServiceAccess":0.5,"taxElasticity":0.05},"desc":"重大決策一律由中央拍板，執行速度快且資源集中，代價是地方民意反彈與治理僵化的風險升高。"}]},{"id":"unification","negName":"本土認同","posName":"傾向統合","start":-1,"desc":"台灣政治最核心也最難移動的一條軸，決定國家定位、教科書怎麼寫、護照怎麼設計，以及兩岸協議能談到哪一步。它同時是外部關係的總開關：往負端走換來美日支持與國際能見度，往正端走換來觀光農產訂單與軍事壓力的緩解。","brackets":[{"range":[-5,-4],"label":"本土認同・主流共識","modifiers":{"usRelation":1.5,"japanRelation":1.5,"intlVisibility":1.5,"prcRelation":-2.5,"prcMilitaryPressure":2,"militancyUnionist":2,"tourismRevenue":-0.18,"defenseBudgetNeed":0.12},"desc":"國家定位問題在島內已無爭議，對外獲得民主陣營全力背書，代價是持續高強度的軍事與經濟施壓。"},{"range":[-3,-2],"label":"本土認同・略有傾向","modifiers":{"usRelation":1,"japanRelation":1,"intlVisibility":1,"prcRelation":-1.5,"prcMilitaryPressure":1.5,"militancyUnionist":1.5,"tourismRevenue":-0.1,"defenseBudgetNeed":0.06},"desc":"美日關係與國際能見度上升，中國大陸軍事壓力同步加重，經濟脅迫類事件的觸發機率明顯提高。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"維持現狀是最大公約數，各方都能各自表述，對外關係與觀光經貿沒有結構性的加成或懲罰。"},{"range":[2,3],"label":"傾向統合・略有傾向","modifiers":{"prcRelation":2,"tourismRevenue":0.12,"usRelation":-1.5,"japanRelation":-1.5,"militancyLocalist":1,"intlVisibility":-1,"defenseBudgetNeed":-0.06},"desc":"兩岸交流與觀光農產出口顯著回溫，但美日對台灣的信任下降，本土認同人口的不滿快速累積。"},{"range":[4,5],"label":"傾向統合・主流共識","modifiers":{"prcRelation":3,"tourismRevenue":0.2,"usRelation":-2.5,"japanRelation":-2.5,"militancyLocalist":2.5,"intlVisibility":-2,"socialTrust":-1,"defenseBudgetNeed":-0.12},"desc":"經貿全面開放帶來立即的收入，安全承諾與國際空間同時大幅萎縮，社會內部撕裂達到危險水位。"}]},{"id":"marketFreedom","negName":"國家干預","posName":"自由市場","start":1,"desc":"決定政府在產業政策、勞動條件、租稅與公用事業定價上介入到什麼程度。台灣長期是國家扶植出口產業的發展型國家，這條軸往正端走會放大科技業的成長紅利，往負端走則保護受薪階級與公共服務，兩端各有清楚的受益者與受害者。","brackets":[{"range":[-5,-4],"label":"國家干預・主流共識","modifiers":{"corpMood":-1.2,"gdpGrowth":-0.005,"publicServiceAccess":1.2,"giniPerYear":-0.01,"corpExitRisk":0.5,"bluecollarSoL":0.6,"energyPrice":-0.08,"defenseSelfReliance":0.5},"desc":"公共服務與所得重分配達到最強，代價是投資意願低落與企業外移壓力，整體成長動能明顯受抑。"},{"range":[-3,-2],"label":"國家干預・略有傾向","modifiers":{"corpMood":-0.8,"publicServiceAccess":0.5,"giniPerYear":-0.004},"desc":"政府對價格與勞動條件的管制加強，貧富差距逐年縮小，企業界對投資環境的評價開始轉為負面。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"市場機制與政府調節維持在多數人可接受的比例，沒有額外的成長加成或分配修正。"},{"range":[2,3],"label":"自由市場・略有傾向","modifiers":{"corpMood":0.6,"gdpGrowth":0.0015},"desc":"法規鬆綁帶動投資信心，成長率小幅上升，勞動與環境管制的執行強度則隨之放鬆。"},{"range":[4,5],"label":"自由市場・主流共識","modifiers":{"corpMood":1.5,"gdpGrowth":0.004,"taxElasticity":0.1,"giniPerYear":0.008,"bluecollarSoL":-0.6,"laborMilitancy":0.4,"energyPrice":0.06,"carbonIntensity":0.05},"desc":"資本效率與稅收彈性達到最佳，貧富差距逐年擴大，藍領生活水準下滑並推高罷工與勞資爭議。"}]},{"id":"progressivism","negName":"傳統價值","posName":"進步價值","start":2,"desc":"涵蓋婚姻家庭、性別平等、族群與世代關係的整體社會氛圍，決定校園教材怎麼編、公共討論的底線在哪裡。台灣在這條軸上已經走得比多數東亞社會前面，但都會與鄉村、青年與長輩之間的落差極大，任何一次修法都會把這道裂縫重新撕開。","brackets":[{"range":[-5,-4],"label":"傳統價值 正端走則保住國際供應鏈的入場券，但立刻反映在電價與傳統產業的存活率上。","brackets":[{"range":[-5,-4],"label":"發展優先・主流共識","modifiers":{"carbonIntensity":0.25,"energyPrice":-0.15,"gdpGrowth":0.004,"corpMood":1.2,"socialTrust":-0.8},"desc":"環評形同背書，電價與土地取得成本壓到最低，空污與公害抗爭則成為地方政治的常態燃料。"},{"range":[-3,-2],"label":"發展優先・略有傾向","modifiers":{"carbonIntensity":0.1,"energyPrice":-0.06,"gdpGrowth":0.0015,"corpMood":0.5},"desc":"重大開發案審查加速，能源成本受到政策壓抑，環保團體的訴訟與陳情案件量同步增加。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"開發與保育在個案中逐案權衡，環評制度照常運作，沒有明確偏向任何一方的結構性修正。"},{"range":[2,3],"label":"環境優先・略有傾向","modifiers":{"carbonIntensity":-0.12,"energyPrice":0.08,"corpMood":-0.6,"tourismRevenue":0.05},"desc":"碳費與環境標準實質收緊，電價緩步上升，綠色供應鏈需求則替出口廠商帶來新的訂單來源。"},{"range":[4,5],"label":"環境優先・主流共識","modifiers":{"carbonIntensity":-0.3,"energyPrice":0.2,"gdpGrowth":-0.004,"corpMood":-1.4,"corpExitRisk":0.35,"tourismRevenue":0.1,"intlVisibility":0.8},"desc":"減碳目標優先於成長目標，國際形象與觀光受益，高耗能產業則面臨關廠外移與大規模轉職壓力。"}]},{"id":"militaryAutonomy","negName":"依賴同盟","posName":"軍事自主","start":-1,"desc":"決定台灣把安全押在外購軍備與盟友承諾上，還是押在自製潛艦、無人機與全民防衛的長期投資上。往負端走軍購成本低、美國關係好，但一旦承諾動搖便無備援；往正端走建立自己的產能與不對稱戰力，代價是龐大預算與盟友的疑慮。","brackets":[{"range":[-5,-4],"label":"依賴同盟・主流共識","modifiers":{"usRelation":1.5,"defenseSelfReliance":-2,"defenseBudgetNeed":-0.15,"asymmetricCapability":-0.5,"militancyLocalist":0.8},"desc":"安全完全託付盟友，軍購成本下降且美方關係最佳，疑美論事件機率上升且本土人口不滿累積。"},{"range":[-3,-2],"label":"依賴同盟・略有傾向","modifiers":{"usRelation":0.8,"defenseSelfReliance":-1,"defenseBudgetNeed":-0.07},"desc":"以外購為主的建軍路線，國防財政壓力較輕，本土軍工體系與人才則持續萎縮流失。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"自製與外購並行，國防預算配置維持慣性，沒有額外的關係加成或自製率修正。"},{"range":[2,3],"label":"軍事自主・略有傾向","modifiers":{"defenseSelfReliance":1,"asymmetricCapability":0.8,"defenseBudgetNeed":0.12,"usRelation":-0.5,"japanRelation":0.5},"desc":"自製艦艇無人機與彈藥產線逐步成形，不對稱戰力提升，國防預算佔比與財政排擠同步升高。"},{"range":[4,5],"label":"軍事自主・主流共識","modifiers":{"defenseSelfReliance":2,"asymmetricCapability":1.5,"defenseBudgetNeed":0.25,"usRelation":-1,"prcMilitaryPressure":0.5,"japanRelation":0.8,"prcRelation":-0.5},"desc":"國防自主成為國家戰略主軸，戰時韌性大幅提高，財政壓力劇增且盟友對戰略意圖產生疑慮。"}]},{"id":"directDemocracy","negName":"菁英治理","posName":"直接民主","start":1,"desc":"決定重大爭議是交給公投與公民審議，還是交給技術官僚與國會多數拍板。台灣的公投門檻與綁大選規則反覆修改，本身就是這條軸的戰場；往正端走參與感與正當性提升，決策速度與政策一致性則付出代價。","brackets":[{"range":[-5,-4],"label":"菁英治理・主流共識","modifiers":{"adminEfficiency":1.2,"lawPassBonus":0.15,"socialTrust":-1.2,"corpMood":0.6,"publicServiceAccess":-0.4},"desc":"決策由專業官僚與黨政高層直接定案，執行效率最高，民眾對制度的疏離與不信任同步惡化。"},{"range":[-3,-2],"label":"菁英治理・略有傾向","modifiers":{"adminEfficiency":0.5,"lawPassBonus":0.07,"socialTrust":-0.5},"desc":"公投門檻拉高、審議程序簡化，政策推動較為順暢，公民團體對黑箱決策的指控隨之增加。"},{"range":[-1,1],"label":"勢均力敵","modifiers":{},"desc":"代議政治與公民參與並行，公投與聽證作為例外程序存在，沒有結構性的效率或信任修正。"},{"range":[2,3],"label":"直接民主・略有傾向","modifiers":{"socialTrust":0.6,"adminEfficiency":-0.5,"lawPassBonus":-0.07},"desc":"公投與公民審議成為常態工具，政策正當性提高，重大建設與稅制改革的推動時程明顯拉長。"},{"range":[4,5],"label":"直接民主・主流共識","modifiers":{"socialTrust":1.2,"adminEfficiency":-1.2,"lawPassBonus":-0.15,"gdpGrowth":-0.002,"corpMood":-0.5,"localAutonomy":0.8},"desc":"幾乎所有爭議都交付公民投票，參與熱度與信任達到最高，行政連續性與長期政策則難以維持。"}]}]},"data/world.json":{"_note":"15 個世界區塊。stance −5~5、economicLink/militaryPressure/techControl/narrativeInfluence 0~5 皆整數；cycle 為 −1.0~1.0 的景氣循環相位，trend 為每回合自然漂移，兩者為具體數值。","blocks":[{"id":"USA","name":"美國","stance":3,"economicLink":4,"militaryPressure":0,"techControl":3,"narrativeInfluence":4,"cycle":0.35,"trend":0.02,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2028},"keyVars":["安全承諾","關稅","科技管制","軍售"],"desc":"台灣安全承諾與科技秩序的最終擔保者，也是最不受台灣控制的變數。每四年一次的政權輪替會重擲安全承諾與關稅立場，孤立主義轉向時軍售交貨遞延、關稅談判籌碼盡失，親善時則帶來軍售加速與國際空間。"},{"id":"CHN","name":"中國大陸","stance":-3,"economicLink":5,"militaryPressure":3,"techControl":2,"narrativeInfluence":4,"cycle":-0.2,"trend":-0.01,"domesticPolitics":{"orientation":"isolationist","nextShiftYear":2032},"keyVars":["軍事壓力","經濟脅迫","統戰滲透","觀光開放","供應鏈"],"desc":"同時是最大的貿易夥伴與唯一的軍事威脅，這個雙重身分讓台灣的每一項經濟決策都帶有國安成本。軍演與禁令是壓力閥，觀光與農產採購是誘因閥，兩者交替使用以牽動島內選民的兩岸議題熱度。"},{"id":"JPN","name":"日本","stance":4,"economicLink":3,"militaryPressure":0,"techControl":2,"narrativeInfluence":3,"cycle":0.1,"trend":0.01,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2030},"keyVars":["安保合作","經貿","科技聯盟","輿論友好"],"desc":"西南諸島的地理位置使日本的安保討論與台海直接綁定，是美國之外最重要的安全側翼。材料與設備供應鏈深度嵌入台灣半導體業，輿論長期友好，但核食與漁權爭議隨時可能被島內政治動員成負面事件。"},{"id":"KOR","name":"韓國","stance":1,"economicLink":3,"militaryPressure":0,"techControl":2,"narrativeInfluence":2,"cycle":0.25,"trend":0.03,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2030},"keyVars":["半導體競爭強度","記憶體週期","產業對抗","文化輸出"],"desc":"在記憶體與先進製程上與台灣正面對撞的產業對手，其擴產決策直接壓縮台灣廠商的報價空間與稼動率。記憶體循環轉強時全球資本支出外溢利多，轉弱時則爆發削價競爭，牽動新竹台南兩地的就業與稅收。"},{"id":"ASEAN","name":"東南亞","stance":0,"economicLink":4,"militaryPressure":0,"techControl":1,"narrativeInfluence":2,"cycle":0.3,"trend":0.02,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2029},"keyVars":["南向投資","移工來源","製造轉移","農產競爭"],"desc":"台商製造基地外移的首選去處，也是移工與新住民的主要來源，直接牽動移民軸與藍領就業。當地成本上升或政局不穩會把訂單推回台灣，反之則加速空洞化，並使南部農產在出口市場遭遇低價競爭。"},{"id":"EU","name":"歐盟","stance":2,"economicLink":3,"militaryPressure":0,"techControl":3,"narrativeInfluence":3,"cycle":-0.05,"trend":0.01,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2029},"keyVars":["碳邊境調整","法規標準","政治聲援","綠能技術"],"desc":"以法規而非軍力影響台灣的區塊，碳邊境調整機制與供應鏈盡職調查會直接轉譯成本土製造業的成本壓力。政治聲援多為象徵性但能提升國際能見度，綠能與電網技術輸出則是能源轉型能否落地的關鍵外部條件。"},{"id":"GBR","name":"英國","stance":2,"economicLink":2,"militaryPressure":0,"techControl":2,"narrativeInfluence":2,"cycle":0,"trend":0.01,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2029},"keyVars":["金融","CPTPP","外交聲援","高教人才"],"desc":"體量不大但在多邊建制中具槓桿地位，是台灣叩關跨太平洋夥伴協定時的重要背書來源。倫敦金融市場的動向影響台灣壽險業的海外部位，國會友台動議則常被島內媒體放大成外交突破的敘事素材。"},{"id":"IND","name":"印度","stance":1,"economicLink":2,"militaryPressure":0,"techControl":1,"narrativeInfluence":1,"cycle":0.35,"trend":0.03,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2029},"keyVars":["製造替代","軟體人才","新興市場","移工協議"],"desc":"被視為分散中國風險的下一個製造腹地，電子代工廠的南亞布局會抽走台灣本島的中階產能。移工引進協議一旦簽署將立即成為國內移民議題的引爆點，軟體人才則補上台灣資訊業長期的人力缺口。"},{"id":"RUS","name":"俄羅斯","stance":-2,"economicLink":1,"militaryPressure":1,"techControl":0,"narrativeInfluence":2,"cycle":-0.3,"trend":-0.01,"domesticPolitics":{"orientation":"isolationist","nextShiftYear":2030},"keyVars":["能源價格","地緣牽制","國際秩序衝擊","認知作戰"],"desc":"透過能源價格與國際秩序的震盪間接影響台灣，歐洲戰事升溫時天然氣現貨飆漲會直接推高電價與物價議題。同時提供威權陣營的行動範本，其對外行動的成敗會被島內兩派各自截取，成為疑美論與備戰論的彈藥。"},{"id":"MEA","name":"中東","stance":0,"economicLink":2,"militaryPressure":1,"techControl":0,"narrativeInfluence":1,"cycle":0.1,"trend":-0.02,"domesticPolitics":{"orientation":"isolationist","nextShiftYear":2031},"keyVars":["原油價格","天然氣價格","航運風險","主權基金"],"desc":"台灣能源進口的上游閥門，波灣局勢緊張時原油與液化天然氣同步跳漲，兩週內就會傳導到油價與電價。荷姆茲海峽與紅海的航運風險還會拉高保費與運費，讓出口導向的製造業毛利瞬間被吃掉一大截。"},{"id":"LATAM","name":"拉丁美洲","stance":0,"economicLink":1,"militaryPressure":0,"techControl":0,"narrativeInfluence":1,"cycle":0.05,"trend":0.01,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2028},"keyVars":["邦交國存續","農產進口","資源","僑社"],"desc":"現存邦交國最集中的區域，任何一國的政權更替都可能觸發斷交事件並重擊執政者的外交評價。同時是黃豆玉米等大宗農產與銅礦的來源，作物歉收或港口罷工會沿著飼料成本一路推升島內的物價議題。"},{"id":"AFR","name":"非洲","stance":0,"economicLink":1,"militaryPressure":0,"techControl":0,"narrativeInfluence":1,"cycle":0.2,"trend":0.02,"domesticPolitics":{"orientation":"isolationist","nextShiftYear":2031},"keyVars":["邦交國","關鍵礦產","新興市場","醫療外交"],"desc":"關鍵礦產的供應源頭，鈷鋰與稀土的出口管制會直接卡住電池與磁性材料的下游廠商。邦交競逐在此地最為激烈，醫療團與農技團是成本最低的外交工具，撤館事件則會被在野方拿來檢驗外交預算的效益。"},{"id":"OCE","name":"大洋洲","stance":3,"economicLink":2,"militaryPressure":0,"techControl":1,"narrativeInfluence":2,"cycle":0.1,"trend":0.01,"domesticPolitics":{"orientation":"internationalist","nextShiftYear":2028},"keyVars":["液化天然氣","農產","太平洋邦交競逐","礦產"],"desc":"台灣天然氣長約與煤炭的主要供應方，其出口政策變動會直接改寫發電成本與備轉容量的假設。太平洋島國是邦交攻防的主戰場，澳紐在區域安全上的表態則常被視為美國承諾之外的第二層安全指標。"},{"id":"INTLORG","name":"國際組織與多邊建制","stance":1,"economicLink":2,"militaryPressure":0,"techContro     'do-show': (d) => doShow(d.id),
    'open-commission': openCommission,
    'commission-poll': (d) => {
      const r = Poll.commission(s, DATA, d.id, d.scope);
      closeModal(); toast(r.msg); render();
    },
    'open-poll': (d) => openPoll(+d.idx),

    /* 憲政 */
    'open-court': () => { ui.politicsTab = 'court'; go('politics'); },
    'open-nominate': (d) => openNominate(+d.idx),
    'nominate': (d) => {
      const rng = new Rng(s.meta.seed, s.meta.rngCounter);
      const r = Court.nominateJustice(s, DATA, +d.idx, d.lean, rng);
      s.meta.rngCounter = rng.counter;
      closeModal(); toast(r.msg); render();
    },

    /* 選舉 */
    'pick-run': (d) => pickRun(d),
    'primary-accept': () => { s.election = null; toast('你留下來輔選。這一次的人情，下一次會有人記得。'); render(); },
    'primary-bolt': boltParty,
    'primary-next': () => { s.election.phase = 'campaign'; updatePoll(); render(); },
    'campaign-action': (d) => campaignAction(d),
    'close-election': () => { s.election = null; go('turn'); },
  };
  (fns[act] ?? ((d) => console.warn('未處理的動作', act, d)))(ds);
}

const reSetup = () => { el('view').innerHTML = setupPage(DATA); };

/* ─────────── 開局 ─────────── */
function startGame() {
  const d = setupDraft;
  if (!d.name.trim() || !d.backgroundId || !d.homeDistrict) return toast('還有必填欄位沒完成。');
  app.state = createGame(DATA, {
    seedStr: d.seedStr || randomSeedString(),
    name: d.name.trim(), gender: d.gender, education: d.education,
    startId: d.startId, backgroundId: d.backgroundId,
    homeDistrict: d.homeDistrict, party: null, ideology: { ...d.ideology },
  });
  go('turn');
  askPartyChoice();
}

function askPartyChoice() {
  const s = app.state;
  const opts = DATA.starts.partyChoice.map((c) => {
    if (c.id === 'independent') {
      return `<button class="opt" data-act="choose-party" data-pid="">
        <div class="opt-t">${esc(c.name)}</div><div class="opt-h">${esc(c.desc)}</div></button>`;
    }
    return c.options.map((pid) => {
      const p = DATA.byId.party[pid];
      return `<button class="opt" data-act="choose-party" data-pid="${pid}">
        <div class="opt-t" style="color:${p.color}">${esc(p.name)}</div>
        <div class="opt-h">${esc(c.name)}｜${esc(c.desc)}</div></button>`;
    }).join('');
  }).join('');
  openModal(`<div class="modal-h">你要靠哪一邊</div>
    <div class="modal-b">這個決定會塑造你接下來八年的整個玩法。大黨有資源但要排隊，小黨出頭快但天花板低，無黨籍什麼都得自己來。</div>${opts}`);
  const orig = handle;
  document.body.addEventListener('click', function once(e) {
    const t = e.target.closest('[data-act="choose-party"]');
    if (!t) return;
    document.body.removeEventListener('click', once);
    const pid = t.dataset.pid || null;
    joinParty(pid);
    closeModal(); render();
  });
}

function joinParty(pid) {
  const s = app.state;
  s.player.party = pid;
  if (!pid) { toast('你決定誰都不靠。'); return; }
  const choice = DATA.starts.partyChoice.find((c) => c.options.includes(pid));
  const p = s.parties[pid];
  p.factions.forEach((f) => { f.favor = 0.5; });
  s.finance.campaign += choice?.effects.campaignFunds ?? 0;
  s.player.partyPrestige = clamp05(s.player.partyPrestige + (choice?.effects.partyPrestige ?? 0));
  s.player.fame = clamp05(s.player.fame + (choice?.effects.fame ?? 0));
  const home = s.districts[s.player.homeDistrict];
  if (home && choice?.effects.grassrootsBonus) home.playerGrassroots = clamp05(home.playerGrassroots + choice.effects.grassrootsBonus);
  s.player.careerLog.push({ turn: 1, kind: 'join', text: `加入${p.name}` });
  toast(`你加入了${p.name}。`);
}

/* ─────────── 回合推進 ─────────── */
function endTurn() {
  const s = app.state;
  if (s.pendingEvents.length) {
    return confirmModal('還有事情沒處理', '待決事項如果不處理，事情會自己往壞的方向走，而且你不會知道原本可以怎樣。', '直接結束回合', () => { s.pendingEvents = []; reallyEnd(); });
  }
  reallyEnd();
}
function reallyEnd() {
  const s = app.state;
  advance(s, DATA);
  checkElection();
  SaveMgr.save(s, 'auto');
  ui.mapArg = { mode: ui.mapMode };
  render();
}

function doAction(id, arg) {
  const s = app.state;
  const r = Char.doAction(s, DATA, id, { arg });
  if (!r.ok) return toast(r.msg);
  const rng = new Rng(s.meta.seed, s.meta.rngCounter);
  const msg = resolveAction(s, id, arg, rng);
  s.meta.rngCounter = rng.counter;
  s.player.ap = Char.apOf(s, DATA);
  toast(msg);
  render();
}

function resolveAction(s, id, arg, rng) {
  const p = s.player;
  switch (id) {
    case 'canvass': {
      const did = arg ?? p.homeDistrict;
      const d = s.districts[did];
      if (!d) return '你不知道要去哪裡跑。';
      const organizer = Team.teamBonus(s, DATA, 'grassrootsGrowth');
      District.grow(s, did, 0.2 + organizer * 0.25);
      d.playerFavor = clampBi(d.playerFavor + 0.25);
      s.finance.campaign -= 30000;
      return `你在${DATA.byId.district[did].name}跑了一整個月，握到的手比講過的話多。`;
    }
    case 'talkshow':
      openShows();
      return '';
    case 'showPrep':
      Show.prepare(s);
      return `你把可能被問的都想過一遍了。準備程度：${word('prep', s.flags.showPrep ?? 0)}。`;
    case 'commissionPoll':
      openCommission();
      return '';
    case 'presser': {
      const heat = Object.entries(s.issues).sort((a, b) => b[1] - a[1])[0][0];
      const r = Media.pressConference(s, DATA, heat, rng);
      return r.text;
    }
    case 'draftLaw':
      s.flags.draftBank = (s.flags.draftBank ?? 0) + 1;
      return '你把條文從頭到尾改了一遍，這一版禁得起委員會的挑剔。';
    case 'prepQuestion':
      Interp.prepare(s);
      return `你把資料讀熟了。現在的準備程度是「${word('prep', s.flags.interpPrep)}」。`;
    case 'fundraise': {
      const amt = Math.round((rng.range(300000, 1800000) * (0.6 + p.fame * 0.35)) / 10000) * 10000;
      s.finance.campaign += amt;
      if (rng.bool(0.18)) { p.stigma = clamp05(p.stigma + 0.15); return `募到 ${F.money(amt)}。席間有幾個人講的話，你聽了以後假裝沒聽到。`; }
      return `募款餐會辦得還算順利，專戶入帳 ${F.money(amt)}。`;
    }
    case 'faction': {
      if (!p.party) return '你沒有政黨，沒有派系大老可以拜會。';
      const party = s.parties[p.party];
      const fac = arg ? party.factions.find((f) => f.id === arg) : rng.pick(party.factions);
      if (!fac) return '找不到那個派系。';
      fac.favor = clampBi(fac.favor + 0.5);
      if (rng.bool(0.35)) { p.politicalCapital = Math.max(0, p.politicalCapital - 10); return `${fac.name}的前輩很客氣地泡了茶，然後很自然地提起一個人的名字。`; }
      return `你去拜會了${fac.name}，該講的場面話都講了，關係近了一點。`;
    }
    case 'trainStaff': {
      const kind = Team.train(s, arg ?? s.team[0]?.id, rng);
      if (!kind) return '你沒有可以帶的人。';
      return kind === 'ability' ? '他今天問的問題比上個月有深度多了。' : '你們聊到很晚，有些話講開了以後，事情就不一樣了。';
    }
    case 'visit': {
      const d = s.central.diplomacy;
      d.usRelation = clampBi(d.usRelation + 0.2);
      p.fame = clamp05(p.fame + 0.15);
      return '這趟出訪很累，但你回來以後講的話，跟出發前不太一樣了。';
    }
    case 'study': {
      const attr = rng.pick(['eloquence', 'judgment', 'sociability', 'charisma']);
      const NAME = { eloquence: '口才', judgment: '判斷', sociability: '交際', charisma: '魅力' };
      const up = Char.study(s, attr);
      return up ? `你在${NAME[attr]}上明顯進步了，現在是「${word(attr, p.attrs[attr])}」。`
        : '你讀完了一本書。這種累積短期內看不出來，但它一直在那裡。';
    }
    case 'dealmaking': {
      p.politicalCapital = Math.min(999, p.politicalCapital + 35);
      p.stigma = clamp05(p.stigma + 0.2);
      Team.witnessSecret(s);
      return '有些事在檯面上永遠談不成，在檯面下十分鐘就有了結論。房間裡的每個人都記得今天。';
    }
    case 'family':
      s.flags.familyDebt = 0;
      return '你難得跟家人好好吃了一頓飯，沒有人提到選舉。';
    case 'rest':
      return '你把整個月的行程都推掉了。幕僚鬆了一口氣，對手也鬆了一口氣。';
  }
  return '完成了。';
}

function proposeLaw(ds) {

  const r = Legis.propose(s, DATA, ds.id, +ds.idx);
  closeModal();
  if (!r.ok) return toast(r.msg);

/* ─────────── 選舉流程 ─────────── */
function checkElection() {
  const s = app.state;
  const { months, sched } = Election.monthsUntilElection(s, DATA);
  s.flags.monthsToElection = months ?? 99;
  if (!sched) return;
  if (s.election) {
    if (s.election.phase === 'campaign') {
      s.election.weeksLeft -= 1;
      updatePoll();
      if (s.election.weeksLeft <= 0) runElection();
    }
    return;
  }
  if (months !== null && months <= 2 && s.meta.scale === 'week' && !s.flags['elecDone_' + sched.year]) {
    const runs = Election.availableRuns(s, DATA, sched);
    if (!runs.length) { s.flags['elecDone_' + sched.year] = true; return; }
    s.election = { phase: 'decide', sched, options: runs, weeksLeft: 8 };
    go('turn');
  }
}

function pickRun(ds) {
  const s = app.state;
  const idx = +ds.idx;
  if (idx < 0) { s.flags['elecDone_' + s.election.sched.year] = true; s.election = null; toast('你決定這一次先不選。'); return render(); }
  const run = s.election.options[idx];
  const rng = new Rng(s.meta.seed, s.meta.rngCounter);
  const pri = Election.primary(s, DATA, run, rng);
  s.meta.rngCounter = rng.counter;
  s.election.run = run;
  s.election.phase = 'primary';
  s.election.primaryMsg = pri.msg;
  s.election.primaryWon = pri.won;
  if (pri.won) {
    s.finance.campaign -= run.level.deposit ?? 0;
    s.election.opponents = Election.makeOpponents(s, DATA, run, new Rng(s.meta.seed, s.meta.rngCounter++));
  }
  render();
}

function boltParty() {
  const s = app.state;
  s.player.partyPrestige = 0;
  s.player.party = null;
  s.election.primaryWon = true;
  s.election.phase = 'campaign';
  s.election.opponents = Election.makeOpponents(s, DATA, s.election.run, new Rng(s.meta.seed, s.meta.rngCounter++));
  toast('你脫黨參選。黨中央發出了一份措辭嚴厲的聲明。');
  updatePoll(); render();
}

function candidates(s) {
  const me = {
    isPlayer: true, name: s.player.name, party: s.player.party ?? 'IND',
    fame: s.player.fame, stigma: s.player.stigma, attrs: s.player.attrs,
  };
  return [me, ...(s.election.opponents ?? [])];
}

function updatePoll() {
  const s = app.state;
  if (!s.election?.run) return;
  const rng = new Rng(s.meta.seed, 999000 + s.meta.turn);
  const r = Election.computeVotes(s, DATA, s.election.run, candidates(s), rng);
  s.election.poll = r.results.map((x) => ({
    name: x.candidate.isPlayer ? s.player.name : x.candidate.name,
    party: x.candidate.party, share: x.share, isPlayer: !!x.candidate.isPlayer,
  }));
  s.election.mobilization = District.mobilization(s, s.player.homeDistrict, s.player.party);
}

function campaignAction(ds) {
  const s = app.state;
  const a = CAMPAIGN_ACTIONS.find((x) => x.id === ds.id);
  if (!a) return;
  const cost = actionCost(s.election?.run, a);
  if (s.player.apUsed + a.ap > (s.player.ap ?? 2)) return toast('行動點不夠了。');
  if (s.finance.campaign < cost) return toast('專戶裡的錢不夠。');
  s.player.apUsed += a.ap;
  s.finance.campaign -= cost;
  s.election.spent = (s.election.spent ?? 0) + cost;
  s.finance.ledger.push({ turn: s.meta.turn, kind: 'out', amount: cost, note: '競選：' + a.name });
  s.player.fatigueRaw = clamp(s.player.fatigueRaw + a.fatigue, 0, 120);
  const rng = new Rng(s.meta.seed, s.meta.rngCounter);
  const msg = resolveCampaign(s, a, rng);
  s.meta.rngCounter = rng.counter;
  updatePoll(); toast(msg); render();
}

function resolveCampaign(s, a, rng) {
  const P = s.pops;
  const run = s.election.run;
  const parts = Election.scopeDistricts(DATA, run.type, run.scopeId);
  const dSet = new Set(parts.map((p) => p.districtId));
  const bump = (field, amt, filter) => {
    for (let i = 0; i < P.n; i++) {
      const d = DATA.districts.districts[P.district[i]];
      if (!dSet.has(d.id)) continue;
      if (filter && !filter(i)) continue;
      P[field][i] = clamp05(P[field][i] + amt);
    }
  };
  switch (a.id) {
    case 'street':
      bump('enthusiasm', 0.12);
      for (const id of dSet) { s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor + 0.12); }
      return '你走了一整週的街，鞋底磨平了一層，但有人開始認得你的臉。';
    case 'rally': {
      const rain = rng.bool(0.15);
      if (rain) { bump('enthusiasm', 0.1); return '造勢晚會遇到下雨，來的人比預期少了一半，但留下來的都淋著雨聽完了。'; }
      bump('enthusiasm', 0.4);
      s.player.fame = clamp05(s.player.fame + 0.1);
      return '場子做得很滿，支持者第一次覺得這件事真的有機會。';
    }
    case 'tv':
      s.player.fame = clamp05(s.player.fame + 0.25);
      for (const id of dSet) s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor + 0.2);
      return '廣告開始在各台輪播，你在早餐店的電視上看到自己。';
    case 'online':
      bump('enthusiasm', 0.45, (i) => DATA.genIds[P.gen[i]] === 'youth');
      return '投放打得很準，年輕族群的討論度整個拉起來了。';
    case 'debate': {
      const roll = s.player.attrs.eloquence * 12 + rng.range(-25, 25);
      if (roll > 45) { for (const id of dSet) s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor + 0.45); return '政見發表會你表現得很好，中間選民開始認真考慮這個名字。'; }
      if (roll < 12) { for (const id of dSet) s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor - 0.35); return '你在台上被問倒了，那一段被對手剪成十五秒的影片。'; }
      return '政見會平順地結束，沒有加分也沒有扣分。';
    }
    case 'negative': {
      const opp = s.election.opponents?.[0];
      if (opp) opp.fame = clamp05(opp.fame - 0.3);
      s.player.integrity = clamp05(s.player.integrity - 0.2);
      if (rng.bool(0.3)) { s.player.favorNational = clampBi(s.player.favorNational - 0.4); return '負面文宣被打成抹黑，反彈比預期大，你的團隊連夜在想怎麼收。'; }
      return '文宣打中了對手的痛處，他們今天開了兩場記者會回應。';
    }
    case 'allocate':
      s.flags.allocateBonus = (s.flags.allocateBonus ?? 0) + (rng.bool(0.7) ? 0.03 : -0.04);
      return rng.bool(0.7) ? '配票的號碼發下去了，樁腳說這次算得很準。' : '配票出了一點差錯，有一區的票被切得太碎。';
    case 'temple':
      for (const id of dSet) District.grow(s, id, 0.15);
      bump('enthusiasm', 0.2, (i) => DATA.genIds[P.gen[i]] === 'senior');
      return '你把該拜的廟都拜了，長輩看的是你有沒有來。';
    case 'motorcade':
      bump('enthusiasm', 0.18);
      for (const id of dSet) s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor + 0.1);
      s.player.fame = clamp05(s.player.fame + 0.06);
      return '宣傳車繞了整個選區一整週，喇叭聲從早響到晚，有人打電話來罵，也有人說終於看到你的名字了。';
    case 'phonebank':
      bump('enthusiasm', 0.3, (i) => P.awareness[i] >= 2.5);
      return '志工打了幾千通電話。接起來的人不多，但接起來的那些，投票日多半真的會出門。';
    case 'billboard': {
      for (const id of dSet) s.districts[id].playerFavor = clampBi(s.districts[id].playerFavor + 0.28);
      s.player.fame = clamp05(s.player.fame + 0.14);
      s.flags.billboardUp = (s.flags.billboardUp ?? 0) + 1;
      return '看板掛上去了。路口那一面特別大，連對手的樁腳都在群組裡轉照片。';
    }
    case 'pr': {
      const roll = s.player.attrs.sociability * 10 + rng.range(-18, 18);
      for (const m of Object.values(s.media)) {
        m.playerRelation = clampBi(m.playerRelation + (roll > 25 ? 0.35 : 0.1));
      }
      s.player.fame = clamp05(s.player.fame + 0.08);
      return roll > 25
        ? '公關公司安排了兩篇專訪跟一支人物影片，這幾天的版面角度明顯對你比較友善。'
        : '公關案子發出去了，效果沒有預期好，但至少負面的那幾則被壓下去一點。';
    }
  }
  return '完成了。';
}

function runElection() {
  const s = app.state;
  const rng = new Rng(s.meta.seed, s.meta.rngCounter);
  const run = s.election.run;
  const cands = candidates(s);
  const r = Election.computeVotes(s, DATA, run, cands, rng);
  s.meta.rngCounter = rng.counter;
  const seats = run.level.system === 'SNTV' ? (DATA.byId.district[run.scopeId]?.seats ?? 1) : 1;
  const winners = r.results.slice(0, seats).map((x) => x.candidate);
  const won = winners.some((c) => c.isPlayer);
  const my = r.results.find((x) => x.candidate.isPlayer);
  const outcome = { won, results: r.results };
  Election.applyResult(s, DATA, run, outcome);
  s.flags['elecDone_' + s.election?.sched?.year] = true;
  s.election = {
    phase: 'result', run, outcome,
    resultText: won
      ? `你以 ${F.int(my.votes)} 票當選。開票那天晚上，服務處外面擠滿了人，你講到一半聲音就啞了。`
      : `你以 ${F.int(my.votes)} 票落選，差距是 ${F.int(Math.abs(r.results[0].votes - my.votes))} 票。有些支持者到最後都沒有離開。`,
  };
  render();
}

/* ─────────── 質詢 ─────────── */
function openInterp() {
  const s = app.state;
  const hot = Object.entries(s.issues).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const styles = Interp.STYLES.map((st) => {

    return `<button class="opt ${ok ? '' : 'locked'}" ${ok ? `data-act="interp-style" data-id="${st.id}"` : ''}>
      <div class="opt-t">${esc(st.name)}</div>
      <div class="opt-h">${esc(st.desc)}${ok ? '' : '　（以你現在的氣魄，你做不出這種事）'}</div></button>`;
  }).join('');
  openModal(`<div class="modal-h">上質詢台</div>
    <div class="modal-b">今天最熱的議題是${esc(DATA.byId.issue[hot[0][0]].name)}。
    準備程度：${esc(word('prep', s.flags.interpPrep ?? 0))}。</div>${styles}`);
  s.flags.interpTopic = hot[0][0];
}

function runInterp(ds) {
  const s = app.state;
  const styleId = ds.id;
  const rng = new Rng(s.meta.seed, s.meta.rngCounter);
  const r = Interp.run(s, DATA, styleId, s.flags.interpTopic, rng);
  s.meta.rngCounter = rng.counter;
  if (!r.ok) { toast(r.msg); return; }
  const TITLE = { great: '大成功', good: '成功', draw: '平手', bad: '失敗', terrible: '大失敗' };
  openModal(`<div class="modal-h">${TITLE[r.outcome]}</div>
    <div class="modal-b">${esc(r.text)}</div>
    <button class="btn primary full" data-act="modal-close">好</button>`);
  render();
}

/* ─────────── 地方議案 ─────────── */
function openLocalBill(ds) {
