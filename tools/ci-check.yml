name: check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 資料檔完整性
        run: node tools/validate-data.js
      - name: 模組載入
        run: node tests/load.mjs
      - name: 頁面渲染與存讀檔
        run: node tests/render.mjs
      - name: 選舉系統
        run: node tests/election.mjs
      - name: 系統整合
        run: node tests/systems.mjs
      - name: 建角與存檔
        run: node tests/setup.mjs
      - name: 前兩次文本與行動點
        run: node tests/firsts.mjs
      - name: 造勢、私人財務、募款、快轉
        run: node tests/v060.mjs
      - name: 提案修法、助理費、服務處、補助款
        run: node tests/v061.mjs
      - name: 同日選舉、選區評估、免費造勢、人群試作
        run: node tests/v062.mjs
      - name: 開局家底與變現摩擦
        run: node tests/v063.mjs
      - name: 長線模擬（120 回合）
        run: node tests/headless.mjs CISEED 120
      - name: 單檔版可以順利打包
        run: node tools/build-single.js
